name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-backend.txt

      # CPU-only torch: the default Linux wheel bundles CUDA (~2.5 GB) and this runner has no GPU. The pinned
      # torch==2.4.1 in requirements-backend.txt is satisfied by the "+cpu" build, so pip keeps it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-backend.txt

      # Tests that load real models (API startup, retrieval, the Ollama integration test) need model downloads,
      # a GPU-sized machine and a running Ollama, so they are left to the local run (see README, Testing).
      - name: Run model-free tests
        run: >
          python -m pytest -q
          --ignore=backend/tests/test_api.py
          --ignore=backend/tests/test_retrieval.py
          --ignore=tests/test_integration.py

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck and build
        run: npm run build
