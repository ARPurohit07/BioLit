# Retrieval / RAG configuration for BioLit.

chunking:
  chunk_size: 400          # target tokens per chunk (fixed-packing fallback only)
  chunk_overlap: 60        # token overlap between adjacent chunks
  min_chunk_tokens: 40     # drop/merge chunks smaller than this
  use_table_transcriptions: false  # vision-model table rewrites (scripts/transcribe_tables.py); measured worse: experiments/eval/table_transcription.md
  semantic: false            # split text at embedding topic-shift boundaries instead of packing to chunk_size
  max_chunk_tokens: 220     # hard cap per chunk when semantic is on
  breakpoint_percentile: 80 # sentence-pair distance percentile that triggers a new chunk

hybrid:
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60                 # RRF constant (standard default)
  final_top_k: 20           # fused candidates handed to the reranker (must be >= candidate_k, or the reranker never sees the full pool)

reranker:
  candidate_k: 20           # candidates fed into the reranker
  output_k: 8                # evidence chunks kept after reranking (at output_k=5 the labelled source chunk was only in context ~84% of questions; lifting to 8 recovers most of the rank-6..10 misses)

# If a generated answer contains no valid [n] marker, ask once more with a reminder. The retry is kept only
# if it actually cites; an answer that just says the evidence is insufficient is left alone.
citation_retry:
  enabled: true
  max_attempts: 1

# If a question-answering answer states a number that is not in the text of the evidence block(s) it cites for
# it, ask once more naming the offending number(s). The retry is kept only if it leaves fewer numbers unverified.
value_check:
  enabled: true

modes:
  fast:
    use_bm25: false
    use_reranker: false
    use_verification: false
    top_k: 5
  balanced:
    use_bm25: true
    use_reranker: true
    use_verification: false
    top_k: 5
  high_faithfulness:
    use_bm25: true
    use_reranker: true
    use_verification: true
    query_decomposition: true
    top_k: 5
    max_regeneration_attempts: 2

vector_store:
  index_path: "data/index/faiss.index"
  metadata_path: "data/index/chunk_metadata.jsonl"
  index_type: "flat_ip"   # cosine via normalized inner product

bm25:
  index_path: "data/index/bm25_index.pkl"
  k1: 1.5
  b: 0.75
